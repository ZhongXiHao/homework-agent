[project]
name = "homework-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "EricChong", email = "ericchongfordev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.0",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "openai>=3.46.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
homework-agent = "homework_agent.native:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
