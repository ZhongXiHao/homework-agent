[project]
name = "homework-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "EricChong", email = "ericchongfordev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.46.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
